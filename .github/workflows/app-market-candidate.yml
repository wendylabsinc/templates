name: Build App Market candidate

# Candidate images are not public catalog releases. Device qualification and a
# reviewed releases.json change promote an immutable candidate to installable.
on:
  push:
    tags:
      - 'app-market-candidate/**'
  workflow_dispatch:
    inputs:
      app:
        type: choice
        required: true
        options: [so101-sim, simple-api]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render fixed release configuration
        id: prepare
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          candidate_app="$APP"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^app-market-candidate/(so101-sim|simple-api)/[a-f0-9]{7,40}$ ]]; then
              echo 'Invalid candidate tag; expected app-market-candidate/APP/COMMIT.' >&2
              exit 1
            fi
            candidate_app="${BASH_REMATCH[1]}"
          fi
          case "$candidate_app" in so101-sim|simple-api) ;; *) exit 1 ;; esac
          python -m unittest discover -s tests -p test_app_market.py
          python tools/app_market.py render "$candidate_app" candidate
          echo "app=$candidate_app" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: candidate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wendylabsinc/template-${{ steps.prepare.outputs.app }}:candidate-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Save candidate identity
        env:
          APP: ${{ steps.prepare.outputs.app }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('candidate/release-candidate.json').write_text(json.dumps({
              'image_reference': 'ghcr.io/wendylabsinc/template-' + os.environ['APP'] + '@' + os.environ['DIGEST'],
              'source_revision': os.environ['GITHUB_SHA'],
              'platforms': ['linux/amd64', 'linux/arm64'],
              'app_config_json': Path('candidate/wendy.json').read_text(),
              'qualification': {}
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: template-${{ steps.prepare.outputs.app }}-candidate
          path: |
            candidate/release-candidate.json
            candidate/wendy.json
