name: LeRobot training image

# Builds ghcr.io/wendylabsinc/lerobot-train, the image `wendy train` runs on
# Nebius, and checks it with a CPU smoke train on a public SO-101 dataset.
# Pull requests build and test it; a push to main also publishes it.

on:
  pull_request:
    paths:
      - 'images/lerobot-train/**'
      - '.github/workflows/lerobot-train-image.yml'
  push:
    branches: [main]
    paths:
      - 'images/lerobot-train/**'
      - '.github/workflows/lerobot-train-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lerobot-train-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/wendylabsinc/lerobot-train
  # Must match the lerobot pin in images/lerobot-train/pyproject.toml
  # (tests/test_entrypoint.py PinsTest checks it).
  LEROBOT_VERSION: '0.6.1'

defaults:
  run:
    # Explicit bash runs with -eo pipefail, so `docker run ... | tee` fails
    # when the container does.
    shell: bash

jobs:
  entrypoint-tests:
    name: Entrypoint tests (stub lerobot-train, fake Hub)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the huggingface_hub version uv.lock pins
        # Only for HubSignatureTest, which checks the entrypoint's Hub calls
        # against the real signatures.
        run: python -m pip install --disable-pip-version-check "huggingface_hub==1.33.0"
      - name: Run the tests
        working-directory: images/lerobot-train
        run: python -m unittest discover -s tests -v

  image:
    name: Build, smoke-train and publish
    needs: entrypoint-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # only the publish step, on pushes to main, uses it
    env:
      LOCAL_TAG: lerobot-train:ci
      SMOKE_DATASET: lerobot/svla_so101_pickplace
      # main on 2026-10-22: a LeRobotDataset v3.0, 50 SO-101 episodes, 86 MB.
      SMOKE_DATASET_REVISION: f641879e22172be7e8161d5e6c1503c2d2feb657
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Free disk space
        # The image is ~7 GB (CUDA torch wheels). The hosted runner's
        # preinstalled SDKs are not needed here.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force
          df -h /

      - name: Build
        run: |
          docker build --platform linux/amd64 \
            --build-arg "IMAGE_TAG=${IMAGE}:lerobot-${LEROBOT_VERSION}" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" \
            --tag "$LOCAL_TAG" \
            images/lerobot-train
          docker image ls "$LOCAL_TAG"
          df -h /

      - name: Bad input fails before any work
        run: |
          set +e
          docker run --rm -e WENDY_TRAIN_DATASET="$SMOKE_DATASET" -e WENDY_TRAIN_PUSH=false \
            "$LOCAL_TAG" > invalid.out
          code=$?
          set -e
          cat invalid.out
          if [[ "$code" -ne 2 ]]; then
            echo "::error::expected exit 2 for a missing WENDY_TRAIN_POLICY, got $code"
            exit 1
          fi
          python3 images/lerobot-train/tests/event_contract.py invalid.out --expect-error WENDY_TRAIN_POLICY

      - name: CPU smoke train (ACT, 3 steps, no push)
        run: |
          mkdir -p "$RUNNER_TEMP/output" "$RUNNER_TEMP/hf-cache"
          docker run --rm \
            -e WENDY_TRAIN_DATASET="$SMOKE_DATASET" \
            -e WENDY_TRAIN_DATASET_REVISION="$SMOKE_DATASET_REVISION" \
            -e WENDY_TRAIN_POLICY=act \
            -e WENDY_TRAIN_STEPS=3 \
            -e WENDY_TRAIN_BATCH_SIZE=2 \
            -e WENDY_TRAIN_PUSH=false \
            -e 'WENDY_TRAIN_EXTRA_ARGS=["--num_workers=0"]' \
            -v "$RUNNER_TEMP/output:/workspace/output" \
            -v "$RUNNER_TEMP/hf-cache:/root/.cache/huggingface" \
            "$LOCAL_TAG" | tee train.out
          python3 images/lerobot-train/tests/event_contract.py train.out --steps 3 --resumed-from 0 --push false

      - name: CPU smoke resume (3 more steps from the checkpoint)
        run: |
          docker run --rm \
            -e WENDY_TRAIN_DATASET="$SMOKE_DATASET" \
            -e WENDY_TRAIN_DATASET_REVISION="$SMOKE_DATASET_REVISION" \
            -e WENDY_TRAIN_POLICY=act \
            -e WENDY_TRAIN_STEPS=6 \
            -e WENDY_TRAIN_BATCH_SIZE=2 \
            -e WENDY_TRAIN_PUSH=false \
            -e 'WENDY_TRAIN_EXTRA_ARGS=["--num_workers=0"]' \
            -v "$RUNNER_TEMP/output:/workspace/output" \
            -v "$RUNNER_TEMP/hf-cache:/root/.cache/huggingface" \
            "$LOCAL_TAG" | tee resume.out
          python3 images/lerobot-train/tests/event_contract.py resume.out --steps 6 --resumed-from 3 --push false
          sudo ls -R "$RUNNER_TEMP/output/train/checkpoints" | head -40

      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in "lerobot-${LEROBOT_VERSION}" "lerobot-${LEROBOT_VERSION}-${GITHUB_SHA::12}"; do
            docker tag "$LOCAL_TAG" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done
