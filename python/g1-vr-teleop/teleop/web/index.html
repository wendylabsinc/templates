<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>G1 VR Teleop</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #0b0d12; color: #e6e9ef; }
    #ui { padding: 24px; max-width: 640px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #8b93a7; margin: 0 0 20px; }
    button { font-size: 20px; padding: 16px 28px; border: 0; border-radius: 12px;
             background: #4f7cff; color: #fff; cursor: pointer; }
    button:disabled { background: #2a3140; color: #6b7280; cursor: default; }
    #status { margin-top: 20px; padding: 12px 16px; border-radius: 10px; background: #151924;
              font-family: ui-monospace, monospace; font-size: 13px; white-space: pre-wrap; min-height: 3em; }
    .ok { color: #5ad18a; } .warn { color: #ffcc66; } .err { color: #ff7a7a; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>G1 VR Teleop — hand driver</h1>
    <p class="sub">Quest 3 · WebXR hand tracking and controllers → Unitree G1.</p>
    <p class="sub">Hands or controllers: whatever you hold drives the robot. Add <code>?input=controllers</code> or <code>?input=hands</code> to the URL to allow only one.</p>
    <button id="enter" disabled>Checking WebXR…</button>
    <div id="status">idle</div>
  </div>
  <script src="./teleop.js" type="module"></script>
</body>
</html>
