# Service topology only — this file stays fully Docker Desktop-compatible.
# Wendy-specific config (appId, GPU entitlement, readiness/postStart hook)
# lives in the companion wendy.json next to it; `wendy run` merges the two.
#
# The DFlash picker option swaps the inference backend at scaffold time:
# Ollama does not support DFlash speculative decoding, so that choice
# replaces the ollama service with a vLLM server exposing an
# OpenAI-compatible API on 8000.
services:
{{if eq .OLLAMA_MODEL "laguna-s-2.1-dflash"}}
  vllm:
    build:
      context: ./vllm
    # The entrypoint exits non-zero on permanent failures (CUDA preflight,
    # repeated fast crashes); restarting with backoff keeps those visible
    # as a restarting container rather than a silent in-container loop.
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - {{.APP_ID}}-hf:/models
{{else}}
  ollama:
    build:
      context: ./ollama
    environment:
      OLLAMA_MODEL: "{{.OLLAMA_MODEL}}"
    ports:
      - "11434:11434"
    volumes:
      - {{.APP_ID}}-models:/models
{{end}}

  open-webui:
    build: ./open-webui
    ports:
      - "{{.PORT}}:{{.PORT}}"
    environment:
      PORT: "{{.PORT}}"
{{if eq .OLLAMA_MODEL "laguna-s-2.1-dflash"}}
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: "http://vllm:8000/v1"
      OPENAI_API_KEY: "wendy-local"
      DEFAULT_MODELS: "laguna-s-2.1"
{{else}}
      OLLAMA_BASE_URL: "http://ollama:11434"
{{end}}
    volumes:
      - {{.APP_ID}}-openwebui:/data
    depends_on:
{{if eq .OLLAMA_MODEL "laguna-s-2.1-dflash"}}
      - vllm
{{else}}
      - ollama
{{end}}

volumes:
{{if eq .OLLAMA_MODEL "laguna-s-2.1-dflash"}}
  {{.APP_ID}}-hf:
{{else}}
  {{.APP_ID}}-models:
{{end}}
  {{.APP_ID}}-openwebui:
