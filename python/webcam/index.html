<!doctype html>
<html class="h-full bg-black overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webcam Stream</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-full flex flex-col m-0 p-0 text-white font-sans overflow-hidden bg-black">
    <div class="fixed inset-0 z-0 flex items-center justify-center bg-black">
      <img
        id="video-stream"
        class="max-w-full max-h-full w-full h-full object-contain"
        alt=""
      />
    </div>

    <!-- UI Overlay -->
    <div class="relative z-10 p-6 flex flex-col justify-between h-full pointer-events-none">
      <div class="flex justify-between items-start">
        <div class="pointer-events-auto">
          <img src="/logo.svg" alt="Wendy Logo" class="h-8 mb-2 drop-shadow-lg" />
          <h1 class="text-xl font-bold drop-shadow-md">Webcam Stream</h1>
          <div class="flex items-center gap-2 mt-1">
            <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-500 shadow-sm"></span>
            <span id="status-text" class="text-xs font-medium uppercase tracking-wider drop-shadow-md">Connecting...</span>
          </div>
        </div>

        <div class="flex flex-col items-end gap-2 pointer-events-auto">
          <select
            id="camera-select"
            class="bg-black/40 hover:bg-black/60 text-white text-xs px-3 py-2 rounded-lg backdrop-blur-sm border border-white/10 outline-none cursor-pointer appearance-none min-w-[160px]"
          >
            <option value="">Loading cameras...</option>
          </select>

          <button id="fullscreen-btn" class="bg-black/40 hover:bg-black/60 p-2 rounded-full backdrop-blur-sm transition-colors border border-white/10 group">
             <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          </button>
        </div>
      </div>

      <div class="flex items-end justify-between">
        <div class="pointer-events-auto bg-black/40 backdrop-blur-md p-3 rounded-lg border border-white/10 text-[10px] flex gap-4 uppercase tracking-widest text-white/70">
          <div><span class="font-bold text-white">FPS:</span> <span id="fps">0</span></div>
          <div><span class="font-bold text-white">Mode:</span> <span id="protocol-status">MJPEG/WS</span></div>
        </div>
      </div>
    </div>

    <div
      id="loading-overlay"
      class="fixed inset-0 z-20 flex items-center justify-center bg-black transition-opacity duration-500"
    >
      <div class="text-center">
        <div class="relative w-16 h-16 mx-auto mb-4">
            <div class="absolute inset-0 border-4 border-blue-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
        <p class="text-gray-400 font-medium tracking-wide">INITIALIZING STREAM</p>
      </div>
    </div>

    <script>
      const imgElement = document.getElementById("video-stream");
      const loadingOverlay = document.getElementById("loading-overlay");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const fpsDisplay = document.getElementById("fps");
      const fullscreenBtn = document.getElementById("fullscreen-btn");
      const cameraSelect = document.getElementById("camera-select");

      let ws = null;
      let frameCount = 0;
      let lastFpsTime = performance.now();
      let reconnectDelay = 2000;
      let prevBlobUrl = null;

      function setStatus(text, color) {
        statusDot.className = `w-2 h-2 rounded-full bg-${color}-500`;
        statusText.textContent = text;
      }

      function updateFps() {
        setInterval(() => {
          const now = performance.now();
          const elapsed = now - lastFpsTime;
          if (elapsed >= 1000) {
            fpsDisplay.textContent = Math.round((frameCount * 1000) / elapsed);
            frameCount = 0;
            lastFpsTime = now;
          }
        }, 1000);
      }

      async function loadCameras() {
        try {
          const res = await fetch("/cameras");
          const cameras = await res.json();
          cameraSelect.innerHTML = "";
          if (cameras.length === 0) {
            cameraSelect.innerHTML = '<option value="">No cameras found</option>';
            return;
          }
          cameras.forEach((cam, i) => {
            const opt = document.createElement("option");
            opt.value = cam.id;
            opt.textContent = cam.name || `Camera ${i}`;
            cameraSelect.appendChild(opt);
          });
        } catch (e) {
          cameraSelect.innerHTML = '<option value="">Failed to load</option>';
        }
      }

      cameraSelect.addEventListener("change", () => {
        const deviceId = cameraSelect.value;
        if (deviceId && ws && ws.readyState === WebSocket.OPEN) {
          setStatus("Switching...", "yellow");
          ws.send(JSON.stringify({ switch_camera: deviceId }));
        }
      });

      function connect() {
        if (ws) ws.close();

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${window.location.host}/stream`);
        ws.binaryType = "blob";

        ws.onopen = () => {
          setStatus("Connected", "yellow");
        };

        ws.onmessage = (event) => {
          if (event.data instanceof Blob) {
            // MJPEG frame received as binary blob
            const url = URL.createObjectURL(event.data);
            imgElement.src = url;
            if (prevBlobUrl) URL.revokeObjectURL(prevBlobUrl);
            prevBlobUrl = url;

            frameCount++;
            loadingOverlay.classList.add("opacity-0");
            loadingOverlay.classList.add("pointer-events-none");
            setStatus("Live", "green");
            reconnectDelay = 2000;
          }
        };

        ws.onclose = () => {
          setStatus("Disconnected", "red");
          loadingOverlay.classList.remove("opacity-0");
          loadingOverlay.classList.remove("pointer-events-none");
          setTimeout(connect, reconnectDelay);
          reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
        };
      }

      fullscreenBtn.onclick = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      };

      loadCameras();
      connect();
      updateFps();
    </script>
  </body>
</html>
